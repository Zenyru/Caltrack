<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CalTrack</title>
<meta name="description" content="Calorie and nutrition tracker with photo food scanning and Sri Lankan foods.">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CalTrack">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ee;
  --bg-2: #ecE8dd;
  --card: #ffffff;
  --card-2: #f8f6f1;
  --text: #17201c;
  --muted: #6b746f;
  --line: #e4e0d6;
  --accent: #0f8a5f;
  --accent-2: #16a874;
  --accent-soft: #dff3ea;
  --saffron: #f08c1a;
  --saffron-soft: #fdebd6;
  --protein: #e2556f;
  --carbs: #f0a21a;
  --fat: #4c7cf0;
  --fiber: #8a5cf0;
  --danger: #d6443c;
  --shadow: 0 1px 2px rgba(20,30,25,.05), 0 8px 24px rgba(20,30,25,.06);
  --radius: 22px;
  --ring-track: #e9e5db;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --bg-2: #141c19; --card: #18211e; --card-2: #1e2925; --text: #eef3f0; --muted: #8e9a94;
    --line: #26332e; --accent: #2fd08f; --accent-2: #22b97c; --accent-soft: #163a2c; --saffron: #ffa53d; --saffron-soft: #3a2a14;
    --protein: #ff6f88; --carbs: #ffbb3d; --fat: #6f97ff; --fiber: #a582ff; --danger: #ff6b62;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); --ring-track: #24302b;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --bg-2: #141c19; --card: #18211e; --card-2: #1e2925; --text: #eef3f0; --muted: #8e9a94;
  --line: #26332e; --accent: #2fd08f; --accent-2: #22b97c; --accent-soft: #163a2c; --saffron: #ffa53d; --saffron-soft: #3a2a14;
  --protein: #ff6f88; --carbs: #ffbb3d; --fat: #6f97ff; --fiber: #a582ff; --danger: #ff6b62;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); --ring-track: #24302b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.45; min-height: 100dvh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.app { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
.hidden { display: none !important; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 14px; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card.flat { box-shadow: none; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.saffron { background: var(--saffron-soft); color: var(--saffron); border-color: transparent; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 16px; font-weight: 700; font-size: 15px; transition: transform .12s ease, opacity .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #06261a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #06261a; } }
.btn.secondary { background: var(--card-2); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon.sm { width: 18px; height: 18px; }
.icon.lg { width: 28px; height: 28px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.date-nav { display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.date-nav button { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
.date-nav span { font-weight: 700; font-size: 13.5px; min-width: 78px; text-align: center; }

/* Hero */
.hero { position: relative; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring .lbl { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }
.hero-stats > div { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.hero-stats > div:last-child { border-bottom: 0; }
.hero-stats b { font-size: 17px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.macro { background: var(--card-2); border-radius: 16px; padding: 12px; border: 1px solid var(--line); }
.macro .name { font-size: 12px; font-weight: 700; color: var(--muted); }
.macro .val { font-size: 16px; font-weight: 800; margin: 2px 0 8px; }
.macro .val span { font-size: 12px; font-weight: 600; color: var(--muted); }
.bar { height: 7px; border-radius: 99px; background: var(--ring-track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.goal-banner { margin-top: 14px; padding: 12px 14px; border-radius: 16px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 600; }

/* Scan CTA */
.scan-cta { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--radius); color: #fff; background: linear-gradient(135deg, #0f8a5f 0%, #12a574 55%, #f08c1a 140%); box-shadow: 0 10px 30px rgba(15,138,95,.25); width: 100%; text-align: left; }
.scan-cta .ic { width: 50px; height: 50px; border-radius: 16px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; }
.scan-cta b { font-size: 16.5px; display: block; }
.scan-cta span { font-size: 13px; opacity: .9; }

/* Meals */
.meal { padding: 0; overflow: hidden; }
.meal-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.meal-emoji { width: 42px; height: 42px; border-radius: 14px; background: var(--card-2); display: flex; align-items: center; justify-content: center; font-size: 21px; border: 1px solid var(--line); }
.meal-add { width: 36px; height: 36px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
.entry { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); }
.entry .thumb { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; background: var(--card-2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
.entry .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .kcal { font-weight: 800; }

/* Water */
.water { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.glass { width: 34px; height: 42px; border-radius: 8px 8px 12px 12px; border: 2px solid var(--line); position: relative; overflow: hidden; background: var(--card-2); }
.glass.full::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 78%; background: linear-gradient(180deg, #5fb8ff, #2b8ef0); }

/* Boosters */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; text-align: left; }
.chip small { display: block; color: var(--saffron); font-weight: 700; font-size: 12px; }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 16px calc(env(safe-area-inset-bottom) + 10px); pointer-events: none; }
.nav-inner { pointer-events: auto; max-width: 488px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 24px; padding: 6px; box-shadow: var(--shadow); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 16px; }
.nav button.active { color: var(--accent); }
.nav .fab { width: 60px; height: 60px; margin: -28px auto 0; border-radius: 22px; background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(15,138,95,.4); justify-content: center; }
.nav .fab .icon { width: 28px; height: 28px; stroke-width: 2.5; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(5,10,8,.5); z-index: 40; opacity: 0; transition: opacity .2s; }
.backdrop.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 520px; margin: 0 auto; background: var(--bg); border-radius: 28px 28px 0 0; max-height: 92dvh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet.show { transform: translateY(0); }
.sheet-grab { width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: 10px auto 4px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 10px; flex: none; }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(env(safe-area-inset-bottom) + 22px); -webkit-overflow-scrolling: touch; }

/* Forms */
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0 0 6px 4px; }
.input, select.input, textarea.input { width: 100%; padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); outline: none; font-size: 16px; }
.input:focus { border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.seg { display: flex; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px 6px; border-radius: 11px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.option { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); margin-bottom: 10px; }
.option.on { border-color: var(--accent); background: var(--accent-soft); }
.option .emo { font-size: 24px; width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); display: flex; align-items: center; justify-content: center; flex: none; }
.option b { display: block; }
.option small { color: var(--muted); }

/* Food list */
.search-wrap { position: relative; }
.search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-wrap .input { padding-left: 44px; }
.cats { margin: 12px 0; }
.food { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 6px; border-bottom: 1px solid var(--line); }
.food .emo { width: 40px; height: 40px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
.food .nm { font-weight: 650; font-weight: 600; }
.food .plus { width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }

.stepper { display: flex; align-items: center; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; }
.stepper button { width: 44px; height: 44px; font-size: 22px; font-weight: 700; color: var(--accent); }
.stepper input { width: 64px; text-align: center; border: 0; background: transparent; font-weight: 800; font-size: 17px; outline: none; }

.nutri-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.nutri-table td { padding: 9px 2px; border-bottom: 1px solid var(--line); }
.nutri-table td:last-child { text-align: right; font-weight: 700; }
.nutri-table tr.main td { font-weight: 800; font-size: 16px; }

/* Scan */
.preview { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 20px; background: var(--card-2); display: block; }
.scan-box { position: relative; }
.scan-box .scanning { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex-direction: column; gap: 10px; }
.scan-box .scanning::before { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #2fd08f, transparent); box-shadow: 0 0 18px #2fd08f; animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { 0% { top: 4%; } 50% { top: 94%; } 100% { top: 4%; } }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.result-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.result-item:last-child { border-bottom: 0; }
.mini-stepper { display: flex; align-items: center; gap: 4px; }
.mini-stepper button { width: 30px; height: 30px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); font-weight: 800; color: var(--accent); }
.mini-stepper span { min-width: 42px; text-align: center; font-weight: 800; font-size: 13.5px; }
.macro-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

/* Progress */
.chart { width: 100%; height: auto; display: block; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.stat .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 14px; z-index: 60; opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Onboarding */
.onb { min-height: 100dvh; display: flex; flex-direction: column; }
.onb-hero { text-align: center; padding: 28px 0 18px; }
.logo { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 14px; display: block; box-shadow: 0 12px 30px rgba(15,138,95,.35); }
.progress-dots { display: flex; gap: 6px; justify-content: center; margin: 6px 0 18px; }
.progress-dots i { width: 22px; height: 5px; border-radius: 9px; background: var(--line); }
.progress-dots i.on { background: var(--accent); }
.empty { text-align: center; padding: 18px 10px; color: var(--muted); font-size: 13.5px; }
.fade-in { animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 370px) {
  .hero-grid { grid-template-columns: 1fr; justify-items: center; }
  .hero-stats { width: 100%; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav hidden" id="nav">
  <div class="nav-inner">
    <button data-tab="today" class="active"><svg class="icon"><use href="#i-home"/></svg>Today</button>
    <button data-tab="foods"><svg class="icon"><use href="#i-book"/></svg>Foods</button>
    <button class="fab" id="fab" aria-label="Add food"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button data-tab="progress"><svg class="icon"><use href="#i-chart"/></svg>Progress</button>
    <button data-tab="profile"><svg class="icon"><use href="#i-user"/></svg>Profile</button>
  </div>
</nav>
<div class="backdrop hidden" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="Close"><svg class="icon sm"><use href="#i-x"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="camInput" class="hidden">
<input type="file" accept="image/*" id="galInput" class="hidden">

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>

].map((x, i) => ({ id: "f" + i, ...x }));
const CATS = ["All", "Rice", "Breakfast", "Curries", "Sides", "Street food", "Sweets", "Fruit", "Drinks", "Snacks"];

const MEALS = [
  { id: "breakfast", name: "Breakfast", e: "🌅" },

const GOALS = {

  lean_gain: { name: "Lean bulk (muscle)", e: "🏋️", adj: 300, desc: "+300 kcal/day · ~0.25 kg/week, minimal fat", protein: 2.0, fat: 0.25 },

const ACTIVITY = [
  { v: 1.2, n: "Sedentary", d: "Desk job, little exercise" },

];
const BOOSTERS = [
  { n: "Extra cup of rice", k: 205, p: 4.3, c: 45, f: 0.4, e: "🍚" },
  { n: "Banana PB shake", k: 520, p: 18, c: 62, f: 22, e: "🥤" },
  { n: "Glass of full cream milk", k: 155, p: 8, c: 12, f: 8, e: "🥛" },
  { n: "Handful of cashews", k: 165, p: 5, c: 9, f: 13, e: "🥜" },
  { n: "1 tbsp coconut oil in curry", k: 120, p: 0, c: 0, f: 14, e: "🫙" },
  { n: "2 boiled eggs", k: 156, p: 12.6, c: 1.2, f: 10.6, e: "🥚" },

];

/* ============================== STORAGE ============================== */
const KEY = "caltrack.v1";
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { toast("Storage full — couldn't save"); } },
};
let S = store.load() || { profile: null, logs: {}, weights: [], favorites: [], recents: [], custom: [], apiKey: "", settings: { theme: "auto", water: 8 } };
S.settings = Object.assign({ theme: "auto", water: 8 }, S.settings || {});
S.custom = S.custom || []; S.favorites = S.favorites || []; S.recents = S.recents || [];
const save = () => store.save(S);

/* ============================== HELPERS ============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r0 = (n) => Math.round(Number(n) || 0);
const r1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const icon = (id, cls = "") => `<svg class="icon ${cls}"><use href="#i-${id}"/></svg>`;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
function haptic() { try { navigator.vibrate && navigator.vibrate(10); } catch {} }
function defaultMeal() { const h = new Date().getHours(); if (h < 11) return "breakfast"; if (h < 16) return "lunch"; if (h < 18) return "snacks"; return "dinner"; }

let viewDate = dkey();
let tab = "today";

function dayLog(k = viewDate) { if (!S.logs[k]) S.logs[k] = { entries: [], water: 0 }; return S.logs[k]; }
function totals(k = viewDate) {
  const L = S.logs[k]; const t = { k: 0, p: 0, c: 0, f: 0, fb: 0, sugar: 0, na: 0 };
  if (!L) return t;
  for (const e of L.entries) { t.k += e.k; t.p += e.p; t.c += e.c; t.f += e.f; t.fb += e.fb || 0; t.sugar += e.sugar || 0; t.na += e.na || 0; }
  return t;
}
function currentWeight() { const w = [...S.weights].sort((a, b) => a.d.localeCompare(b.d)); return w.length ? w[w.length - 1].kg : S.profile?.weight; }

/* ============================== TARGETS ============================== */
function calcTargets(p) {
  const kg = currentWeight() || p.weight;
  const bmr = 10 * kg + 6.25 * p.height - 5 * p.age + (p.sex === "male" ? 5 : -161);
  const tdee = bmr * p.activity;
  const g = GOALS[p.goal];
  let kcal = Math.round((tdee + g.adj) / 10) * 10;
  kcal = Math.max(kcal, p.sex === "male" ? 1500 : 1200);
  const protein = Math.round(kg * g.protein);
  const fat = Math.round((kcal * g.fat) / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const fiber = Math.round((kcal / 1000) * 14);
  const water = Math.max(8, Math.round((kg * 35) / 250));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, fat, carbs, fiber, water, weekly: (g.adj * 7) / 7700 };
}
const T = () => (S.profile ? Object.assign(calcTargets(S.profile), S.profile.custom || {}) : null);

/* ============================== THEME ============================== */
function applyTheme() {
  const t = S.settings.theme;
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
}

/* ============================== ONBOARDING ============================== */
let onb = { step: 0, d: { name: "", sex: "male", age: 25, height: 170, weight: 60, target: 68, activity: 1.375, goal: "gain" } };
function renderOnboarding() {
  $("#nav").classList.add("hidden");
  const d = onb.d; const st = onb.step;
  const dots = `<div class="progress-dots">${[0, 1, 2, 3].map((i) => `<i class="${i <= st ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (st === 0) {
    body = `<div class="onb-hero fade-in"><img class="logo" src="icons/icon.svg" alt="">
      <h1>Welcome to CalTrack</h1><p class="muted">Snap a photo of your plate — rice &amp; curry included — and get calories and full nutrition in seconds.</p></div>
      <div class="card fade-in"><label class="field"><span>What should we call you?</span><input class="input" id="o-name" placeholder="Your name" value="${esc(d.name)}" autocomplete="given-name"></label>
      <div class="field"><span class="tiny muted" style="display:block;font-weight:700;margin:0 0 6px 4px">Sex (for calorie formula)</span>
      <div class="seg" id="o-sex"><button data-v="male" class="${d.sex === "male" ? "on" : ""}">Male</button><button data-v="female" class="${d.sex === "female" ? "on" : ""}">Female</button></div></div></div>`;
  } else if (st === 1) {
    body = `<div class="onb-hero fade-in"><h1>About you</h1><p class="muted">Used to calculate your daily calorie needs.</p></div>
      <div class="card fade-in"><div class="grid3">
      <label class="field"><span>Age</span><input class="input" id="o-age" type="number" inputmode="numeric" value="${d.age}"></label>
      <label class="field"><span>Height (cm)</span><input class="input" id="o-height" type="number" inputmode="decimal" value="${d.height}"></label>
      <label class="field"><span>Weight (kg)</span><input class="input" id="o-weight" type="number" inputmode="decimal" step="0.1" value="${d.weight}"></label></div>
      <span class="tiny muted" style="display:block;font-weight:700;margin:4px 0 8px 4px">Activity level</span>
      ${ACTIVITY.map((a) => `<button class="option ${d.activity === a.v ? "on" : ""}" data-act="${a.v}"><div class="grow"><b>${a.n}</b><small>${a.d}</small></div></button>`).join("")}</div>`;
  } else if (st === 2) {
    body = `<div class="onb-hero fade-in"><h1>What's your goal?</h1><p class="muted">You can change this anytime in Profile.</p></div>
      <div class="fade-in">${Object.entries(GOALS).map(([k, g]) => `<button class="option ${d.goal === k ? "on" : ""}" data-goal="${k}"><div class="emo">${g.e}</div><div class="grow"><b>${g.name}</b><small>${g.desc}</small></div></button>`).join("")}
      <div class="card flat" style="margin-top:6px"><label class="field" style="margin:0"><span>Target weight (kg)</span><input class="input" id="o-target" type="number" inputmode="decimal" step="0.1" value="${d.target}"></label></div></div>`;
  } else {
    const t = calcTargets({ ...d });
    S.profile = null;
    const g = GOALS[d.goal];
    const diff = d.target - d.weight;
    const weeks = t.weekly !== 0 && Math.sign(diff) === Math.sign(t.weekly) ? Math.ceil(Math.abs(diff / t.weekly)) : null;
    body = `<div class="onb-hero fade-in"><h1>Your daily plan</h1><p class="muted">${g.e} ${g.name}</p></div>
      <div class="card fade-in" style="text-align:center"><div class="muted small" style="font-weight:700">DAILY CALORIE TARGET</div>
      <div style="font-size:48px;font-weight:800;letter-spacing:-.04em;color:var(--accent)">${t.kcal.toLocaleString()}</div><div class="muted small">kcal · maintenance is ${t.tdee.toLocaleString()} kcal</div>
      <div class="macros"><div class="macro"><div class="name">Protein</div><div class="val">${t.protein}<span>g</span></div><div class="bar"><i style="width:100%;background:var(--protein)"></i></div></div>
      <div class="macro"><div class="name">Carbs</div><div class="val">${t.carbs}<span>g</span></div><div class="bar"><i style="width:100%;background:var(--carbs)"></i></div></div>
      <div class="macro"><div class="name">Fat</div><div class="val">${t.fat}<span>g</span></div><div class="bar"><i style="width:100%;background:var(--fat)"></i></div></div></div>
      ${weeks ? `<div class="goal-banner" style="background:var(--accent-soft);color:var(--accent);justify-content:center">${icon("target", "sm")} Reach ${d.target} kg in about ${weeks} weeks</div>` : ""}</div>`;
  }
  $("#app").innerHTML = `<div class="onb">${dots}<div class="grow">${body}</div>
    <div class="row" style="margin-top:18px">${st > 0 ? `<button class="btn secondary" id="o-back">${icon("left", "sm")}</button>` : ""}
    <button class="btn primary grow" id="o-next">${st === 3 ? "Start tracking" : "Continue"}</button></div></div>`;

  const grab = () => {
    const v = (id) => $("#" + id)?.value;

    if (st < 3) { onb.step++; renderOnboarding(); return; }
    S.profile = { ...d, created: dkey() };
    S.weights = [{ d: dkey(), kg: d.weight }];
    save(); render();
    toast(`Let's go${d.name ? ", " + d.name : ""}! 🎉`);
  };
}

/* ============================== TODAY ============================== */
function ring(pct, color, size = 150, stroke = 14) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(pct, 1));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--ring-track)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/>
    ${pct > 1 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--saffron)" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(pct - 1, 1))}"/>` : ""}</svg>`;
}
function dateLabel(k) {
  const today = dkey();
  if (k === today) return "Today";
  if (k === addDays(today, -1)) return "Yesterday";
  return parseKey(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
function streak() {
  let n = 0, k = dkey();
  if (!(S.logs[k]?.entries.length)) k = addDays(k, -1);
  while (S.logs[k]?.entries.length) { n++; k = addDays(k, -1); }
  return n;
}
function renderToday() {
  const t = T(); const tot = totals(); const L = S.logs[viewDate] || { entries: [], water: 0 };
  const gaining = ["gain", "fast_gain", "lean_gain"].includes(S.profile.goal);
  const left = t.kcal - tot.k;
  const pct = tot.k / t.kcal;
  const hr = new Date().getHours();
  const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  const isToday = viewDate === dkey();
  let banner = "";
  if (gaining && isToday) {
    if (left > 0 && hr >= 18) banner = `<div class="goal-banner" style="background:var(--saffron-soft);color:var(--saffron)">${icon("bolt", "sm")}<span>${left} kcal to go — add a booster below to hit your gain target</span></div>`;
    else if (left <= 0) banner = `<div class="goal-banner" style="background:var(--accent-soft);color:var(--accent)">${icon("star", "sm")}<span>Target hit! Great work fuelling your gains 💪</span></div>`;
  } else if (!gaining && left < 0 && S.profile.goal === "lose") {
    banner = `<div class="goal-banner" style="background:var(--saffron-soft);color:var(--saffron)">${icon("flame", "sm")}<span>${-left} kcal over today's target</span></div>`;
  }
  const mac = (name, val, goal, color) => `<div class="macro"><div class="name">${name}</div><div class="val">${r0(val)}<span>/${goal}g</span></div><div class="bar"><i style="width:${Math.min(100, (val / goal) * 100)}%;background:${color}"></i></div></div>`;
  const st = streak();

  const meals = MEALS.map((m) => {
    const es = L.entries.filter((e) => e.meal === m.id);
    const mk = es.reduce((a, e) => a + e.k, 0);
    return `<div class="card meal"><div class="meal-head"><div class="meal-emoji">${m.e}</div><div class="grow"><h3>${m.name}</h3><div class="small muted">${es.length ? `${r0(mk)} kcal · ${es.length} item${es.length > 1 ? "s" : ""}` : "Nothing logged yet"}</div></div>
      <button class="meal-add" data-addmeal="${m.id}" aria-label="Add to ${m.name}">${icon("plus", "sm")}</button></div>
      ${es.map((e) => `<button class="entry" data-entry="${e.id}" style="width:100%;text-align:left">${e.img ? `<img class="thumb" src="${e.img}" alt="">` : `<div class="thumb">${e.e || "🍽️"}</div>`}
        <div class="grow"><div class="name">${esc(e.n)}</div><div class="tiny muted">${esc(e.s || "")}${e.q && e.q !== 1 ? ` × ${r1(e.q)}` : ""} · P ${r0(e.p)} · C ${r0(e.c)} · F ${r0(e.f)}</div></div><div class="kcal">${r0(e.k)}</div></button>`).join("")}</div>`;
  }).join("");

  const glasses = Array.from({ length: Math.max(S.settings.water || t.water, L.water) }, (_, i) => `<button class="glass ${i < L.water ? "full" : ""}" data-glass="${i}" aria-label="Glass ${i + 1}"></button>`).join("");

  return `<div class="top"><div><div class="small muted" style="font-weight:600">${greet}${S.profile.name ? ", " + esc(S.profile.name) : ""} 👋</div><h1>${dateLabel(viewDate)}</h1></div>
    <div class="date-nav"><button id="dPrev" aria-label="Previous day">${icon("left", "sm")}</button><button id="dNext" aria-label="Next day" ${isToday ? 'style="opacity:.3"' : ""}>${icon("right", "sm")}</button></div></div>
    <div class="card hero fade-in"><div class="hero-grid"><div class="ring">${ring(pct, "var(--accent)")}<div class="center"><div class="big">${r0(Math.abs(left)).toLocaleString()}</div><div class="lbl">${left >= 0 ? "kcal left" : "kcal over"}</div></div></div>
      <div class="hero-stats"><div><span class="muted small">Target</span><b>${t.kcal.toLocaleString()}</b></div><div><span class="muted small">Eaten</span><b>${r0(tot.k).toLocaleString()}</b></div><div><span class="muted small">Goal</span><span class="pill accent tiny">${GOALS[S.profile.goal].e} ${GOALS[S.profile.goal].name}</span></div>${st > 1 ? `<div><span class="muted small">Streak</span><b>🔥 ${st} days</b></div>` : ""}</div></div>
      <div class="macros">${mac("Protein", tot.p, t.protein, "var(--protein)")}${mac("Carbs", tot.c, t.carbs, "var(--carbs)")}${mac("Fat", tot.f, t.fat, "var(--fat)")}</div>${banner}</div>
    <div style="margin-top:14px"><button class="scan-cta" id="scanCta"><div class="ic">${icon("camera", "lg")}</div><div class="grow"><b>Scan your meal</b><span>Snap a photo to get full nutrition instantly</span></div>${icon("right")}</button></div>
    ${gaining ? `<div class="section-title"><h2>Calorie boosters</h2><span class="small muted">tap to add</span></div><div class="chips">${BOOSTERS.map((b, i) => `<button class="chip" data-boost="${i}">${b.e} ${b.n}<small>+${b.k} kcal</small></button>`).join("")}</div>` : ""}
    <div class="section-title"><h2>Meals</h2><span class="small muted">${L.entries.length} items</span></div>
    <div class="stack">${meals}</div>
    <div class="card" style="margin-top:14px"><div class="row between"><div><h3>💧 Water</h3><div class="small muted">${L.water} of ${S.settings.water || t.water} glasses</div></div><div class="row"><button class="icon-btn" id="wMinus" aria-label="Remove glass">−</button><button class="icon-btn" id="wPlus" aria-label="Add glass" style="color:var(--accent)">${icon("plus", "sm")}</button></div></div><div class="water">${glasses}</div></div>
    <div class="card flat" style="margin-top:14px"><div class="row between"><div><div class="tiny muted" style="font-weight:700">FIBRE</div><b>${r0(tot.fb)} / ${t.fiber} g</b></div><div><div class="tiny muted" style="font-weight:700">SUGAR</div><b>${r0(tot.sugar)} g</b></div><div><div class="tiny muted" style="font-weight:700">SODIUM</div><b>${r0(tot.na)} mg</b></div></div></div>`;
}
function bindToday() {
  $("#dPrev").onclick = () => { viewDate = addDays(viewDate, -1); render(); };
  $("#dNext").onclick = () => { if (viewDate < dkey()) { viewDate = addDays(viewDate, 1); render(); } };
  $("#scanCta").onclick = () => openScan();
  $$("[data-addmeal]").forEach((b) => (b.onclick = () => openAdd(b.dataset.addmeal)));
  $$("[data-entry]").forEach((b) => (b.onclick = () => openEntry(b.dataset.entry)));
  $$("[data-boost]").forEach((b) => (b.onclick = () => { const x = BOOSTERS[+b.dataset.boost]; addEntry({ n: x.n, e: x.e, k: x.k, p: x.p, c: x.c, f: x.f, fb: 0, s: "booster", meal: "snacks" }); }));
  const L = dayLog();
  const setW = (n) => { L.water = Math.max(0, n); save(); haptic(); render(); };
  $("#wPlus").onclick = () => setW(L.water + 1);
  $("#wMinus").onclick = () => setW(L.water - 1);
  $$("[data-glass]").forEach((b) => (b.onclick = () => { const i = +b.dataset.glass; setW(i < L.water ? i : i + 1); }));
}

function addEntry(x, quiet) {
  const L = dayLog();
  const e = { id: uid(), t: Date.now(), q: 1, fb: 0, ...x };
  e.meal = e.meal || defaultMeal();
  L.entries.push(e);
  if (x.fid) { S.recents = [x.fid, ...S.recents.filter((r) => r !== x.fid)].slice(0, 12); }
  save(); haptic();
  if (!quiet) toast(`Added ${e.n} · ${r0(e.k)} kcal`);
  render();
}

/* ============================== SHEET ============================== */
function openSheet(title, html, onBind) {
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = html;
  $("#sheetBody").scrollTop = 0;
  const bd = $("#backdrop"); bd.classList.remove("hidden");
  requestAnimationFrame(() => { bd.classList.add("show"); $("#sheet").classList.add("show"); });
  onBind && onBind($("#sheetBody"));
}
function closeSheet() {
  $("#sheet").classList.remove("show"); const bd = $("#backdrop"); bd.classList.remove("show");

/* ============================== PHOTO SCAN (Claude vision) ============================== */
const SDK_URL = "./vendor/anthropic-sdk.js"; // @anthropic-ai/sdk 1.2.0, bundled for the browser
const DEFAULT_MODEL = "claude-opus-5-5";
let Anthropic = null;
async function getSDK() { if (!Anthropic) Anthropic = (await import(SDK_URL)).default; return Anthropic; }

const NUTRI_SCHEMA = {
  type: "object", additionalProperties: false,
  required: ["is_food", "dish_name", "confidence", "items", "notes", "goal_tip"],
  properties: {
    is_food: { type: "boolean" },
    dish_name: { type: "string" },
    confidence: { type: "string", enum: ["high", "medium", "low"] },
    items: { type: "array", items: { type: "object", additionalProperties: false,
      required: ["name", "emoji", "portion", "grams", "calories", "protein_g", "carbs_g", "fat_g", "fiber_g", "sugar_g", "sodium_mg"],
      properties: { name: { type: "string" }, emoji: { type: "string" }, portion: { type: "string" }, grams: { type: "number" }, calories: { type: "number" }, protein_g: { type: "number" }, carbs_g: { type: "number" }, fat_g: { type: "number" }, fiber_g: { type: "number" }, sugar_g: { type: "number" }, sodium_mg: { type: "number" } } } },
    notes: { type: "string" },
    goal_tip: { type: "string" },
  },
};
function systemPrompt() {
  const g = S.profile ? GOALS[S.profile.goal].name : "general health";
  return `You are a nutritionist who specialises in Sri Lankan and South Asian food. You estimate the nutrition of meals from photos.

For each photo:
- Identify every distinct food item on the plate separately. Rice is the most common base in Sri Lanka: always list rice as its own item when present, and name the variety if you can tell (white/nadu, red/rathu kekulu, samba, keeri samba, basmati, suwandel, fried rice, biriyani, kiribath, yellow rice). Estimate its cooked volume in cups (1 cup cooked ≈ 160 g).
- List each curry, sambol, mallung, papadam, egg, meat, fish and drink separately too.
- Estimate portion size from visual cues (plate size, cutlery, hand, depth of food). Sri Lankan home and restaurant rice portions are often 2–3 cups.
- Account for coconut milk, coconut oil and frying, which add a lot of fat and calories to Sri Lankan curries.
- Give per-item values for the portion you see (not per 100 g).
- If the user gives a description or correction, trust it over what the image suggests.
- If the image isn't food, set is_food to false and return an empty items list.
- notes: one or two short sentences on assumptions (e.g. "assumed coconut-milk chicken curry").
- goal_tip: one short, practical tip for this meal given the user's goal: ${g}. Keep it friendly and specific to Sri Lankan food.`;
}
async function resizeImage(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const full = c.toDataURL("image/jpeg", 0.85);
    const t = document.createElement("canvas"); const ts = 120 / Math.max(c.width, c.height); t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts);
    t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
    return { full, thumb: t.toDataURL("image/jpeg", 0.7) };
  } finally { URL.revokeObjectURL(url); }
}
async function analyzeFood(dataUrl, hint) {
  const A = await getSDK();
  const client = new A({ apiKey: S.apiKey, dangerouslyAllowBrowser: true });
  const params = {
    model: S.settings.model || DEFAULT_MODEL,
    max_tokens: 16000,
    system: systemPrompt(),
    output_config: { effort: "medium", format: { type: "json_schema", schema: NUTRI_SCHEMA } },
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: dataUrl.split(",")[1] } },
      { type: "text", text: hint ? `Estimate the nutrition of this meal. My description: ${hint}` : "Estimate the nutrition of this meal." },
    ] }],
  };
  let res;
  try {
    // Server-side fallback: if the model declines, the API re-runs on a recommended fallback model.
    res = await client.beta.messages.create({ ...params, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" });
  } catch (err) {
    if (err instanceof A.BadRequestError && /fallback/i.test(err.message || "")) res = await client.messages.create(params);
    else throw err;
  }
  if (res.stop_reason === "refusal") throw new Error("The model couldn't analyse this photo. Try another angle or add a description.");
  if (res.stop_reason === "max_tokens") throw new Error("Response was cut off. Please try again.");
  const text = res.content.filter((b) => b.type === "text").map((b) => b.text).join("");
  try { return JSON.parse(text); } catch { throw new Error("Couldn't read the nutrition result. Please try again."); }
}
function friendlyError(err) {
  const A = Anthropic;
  if (A) {
    if (err instanceof A.AuthenticationError) return "Your API key was rejected. Check it in Profile → AI photo scanning.";
    if (err instanceof A.PermissionDeniedError) return "This API key doesn't have access to the model.";
    if (err instanceof A.RateLimitError) return "Too many requests right now — wait a moment and try again.";
    if (err instanceof A.APIConnectionError) return "No connection. Check your internet and try again.";
    if (err instanceof A.InternalServerError) return "The AI service is busy. Please try again shortly.";
    if (err instanceof A.APIError) return err.message || "Request failed.";
  }
  if (!navigator.onLine) return "You're offline — photo scanning needs internet. Use search instead.";
  return err?.message || "Something went wrong.";
}

function showResult(r, img, hint) {
  if (!r.is_food || !r.items?.length) {

      <div class="grow small"><div class="muted">${r0((s.k / t.kcal) * 100)}% of your daily target</div>
        <div class="bar" style="height:10px;margin:10px 0 6px;display:flex"><i style="width:${(s.p * 4 / mk) * 100}%;background:var(--protein);border-radius:0"></i><i style="width:${(s.c * 4 / mk) * 100}%;background:var(--carbs);border-radius:0"></i><i style="width:${(s.f * 9 / mk) * 100}%;background:var(--fat);border-radius:0"></i></div>
        <div class="macro-row" style="margin:0"><span><i class="dot" style="background:var(--protein)"></i>P ${r0(s.p)}g</span><span><i class="dot" style="background:var(--carbs)"></i>C ${r0(s.c)}g</span><span><i class="dot" style="background:var(--fat)"></i>F ${r0(s.f)}g</span></div></div></div>

function lineChart(points, opts = {}) {
  const W = 340, H = 170, P = { l: 34, r: 12, t: 14, b: 26 };
  if (points.length < 1) return `<div class="empty">Log your weight to see your trend</div>`;
  const ys = points.map((p) => p.y).concat(opts.target != null ? [opts.target] : []);
  let min = Math.min(...ys), max = Math.max(...ys); if (max - min < 2) { min -= 1; max += 1; }
  const pad = (max - min) * 0.12; min -= pad; max += pad;
  const n = points.length;
  const x = (i) => P.l + (n === 1 ? (W - P.l - P.r) / 2 : (i / (n - 1)) * (W - P.l - P.r));
  const y = (v) => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const area = `${path} L${x(n - 1)},${H - P.b} L${x(0)},${H - P.b} Z`;
  const ticks = [min + pad, (min + max) / 2, max - pad];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${r1(t)}</text>`).join("")}
    ${opts.target != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(opts.target)}" y2="${y(opts.target)}" stroke="var(--saffron)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - P.r}" y="${y(opts.target) - 5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--saffron)">Goal ${opts.target}</text>` : ""}
    ${n > 1 ? `<path d="${area}" fill="url(#lg)"/>` : ""}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="${i === n - 1 ? 4.5 : 3}" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${x(0)}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="${n === 1 ? "middle" : "start"}">${points[0].l}</text>${n > 1 ? `<text x="${x(n - 1)}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${points[n - 1].l}</text>` : ""}</svg>`;
}
function barChart(days, target) {
  const W = 340, H = 170, P = { l: 8, r: 8, t: 18, b: 24 };
  const max = Math.max(target * 1.25, ...days.map((d) => d.v));
  const bw = (W - P.l - P.r) / days.length;
  const y = (v) => P.t + (1 - v / max) * (H - P.t - P.b);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${days.map((d, i) => { const h = H - P.b - y(d.v); const hit = d.v >= target * 0.95; return `<rect x="${P.l + i * bw + bw * 0.2}" y="${y(d.v)}" width="${bw * 0.6}" height="${Math.max(0, h)}" rx="7" fill="${d.v ? (hit ? "var(--accent)" : "var(--carbs)") : "var(--ring-track)"}" opacity="${d.today ? 1 : 0.85}"/>
      ${d.v ? `<text x="${P.l + i * bw + bw / 2}" y="${y(d.v) - 5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--muted)">${(d.v / 1000).toFixed(1)}k</text>` : ""}
      <text x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" font-weight="${d.today ? 800 : 600}" fill="${d.today ? "var(--text)" : "var(--muted)"}">${d.l}</text>`; }).join("")}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--saffron)" stroke-width="1.5" stroke-dasharray="6 4"/></svg>`;
}
function renderProgress() {
  const t = T(); const p = S.profile; const today = dkey();
  const days = Array.from({ length: 7 }, (_, i) => { const k = addDays(today, i - 6); return { k, v: r0(totals(k).k), l: parseKey(k).toLocaleDateString(undefined, { weekday: "narrow" }), today: k === today }; });
  const logged = days.filter((d) => d.v > 0);
  const avg = logged.length ? r0(logged.reduce((a, d) => a + d.v, 0) / logged.length) : 0;
  const hit = logged.filter((d) => (["lose"].includes(p.goal) ? d.v <= t.kcal * 1.05 : d.v >= t.kcal * 0.95)).length;
  const ws = [...S.weights].sort((a, b) => a.d.localeCompare(b.d)).slice(-30);
  const pts = ws.map((w) => ({ y: w.kg, l: parseKey(w.d).toLocaleDateString(undefined, { day: "numeric", month: "short" }) }));
  const cw = currentWeight(); const start = ws[0]?.kg ?? p.weight; const change = r1(cw - start);
  const toGo = r1(p.target - cw);
  const avgProt = logged.length ? r0(days.filter((d) => d.v).reduce((a, d) => a + totals(d.k).p, 0) / logged.length) : 0;
  const pctGoal = p.target !== start ? Math.max(0, Math.min(100, ((cw - start) / (p.target - start)) * 100)) : 100;
  const eta = t.weekly && Math.sign(toGo) === Math.sign(t.weekly) && Math.abs(toGo) > 0.05 ? new Date(Date.now() + Math.abs(toGo / t.weekly) * 7 * 864e5).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : null;
  return `<div class="top"><div><div class="small muted" style="font-weight:600">Your journey</div><h1>Progress</h1></div><button class="btn primary" id="wLog" style="padding:10px 14px">${icon("scale", "sm")} Log weight</button></div>
    <div class="card"><div class="row between"><div><div class="tiny muted" style="font-weight:700">CURRENT</div><div style="font-size:30px;font-weight:800;letter-spacing:-.03em">${cw} <span class="small muted">kg</span></div></div>
      <div style="text-align:right"><div class="tiny muted" style="font-weight:700">GOAL</div><div style="font-size:22px;font-weight:800;color:var(--saffron)">${p.target} kg</div></div></div>
      <div class="bar" style="height:10px;margin:12px 0 6px"><i style="width:${pctGoal}%;background:linear-gradient(90deg,var(--accent),var(--saffron))"></i></div>
      <div class="row between small muted"><span>${change >= 0 ? "+" : ""}${change} kg since start</span><span>${Math.abs(toGo) < 0.05 ? "Goal reached 🎉" : `${Math.abs(toGo)} kg to go`}</span></div>
      <div style="margin-top:12px">${lineChart(pts, { target: p.target })}</div>
      ${eta ? `<div class="goal-banner" style="background:var(--accent-soft);color:var(--accent)">${icon("target", "sm")}<span>At this plan you'll reach ${p.target} kg around ${eta}</span></div>` : ""}</div>
    <div class="section-title"><h2>Last 7 days</h2><span class="small muted">target ${t.kcal.toLocaleString()}</span></div>
    <div class="card">${barChart(days, t.kcal)}</div>
    <div class="stat-grid" style="margin-top:12px">
      <div class="stat"><div class="k">Avg calories</div><div class="v">${avg.toLocaleString()}</div><div class="tiny muted">${avg ? `${avg - t.kcal >= 0 ? "+" : ""}${avg - t.kcal} vs target` : "no data yet"}</div></div>
      <div class="stat"><div class="k">Days on target</div><div class="v">${hit}/${logged.length || 0}</div><div class="tiny muted">this week</div></div>
      <div class="stat"><div class="k">Avg protein</div><div class="v">${avgProt} g</div><div class="tiny muted">goal ${t.protein} g</div></div>
      <div class="stat"><div class="k">Logging streak</div><div class="v">🔥 ${streak()}</div><div class="tiny muted">days</div></div></div>
    ${["gain", "fast_gain", "lean_gain"].includes(p.goal) ? `<div class="section-title"><h2>Weight gain playbook</h2></div><div class="card small" style="line-height:1.65">
      <b>🍚 Make rice work for you.</b> An extra cup of rice at lunch and dinner adds ~400 kcal/day.<br>
      <b>🥥 Use calorie-dense sides.</b> Pol sambol, coconut-milk curries and a spoon of ghee add energy without filling you up.<br>
      <b>🥤 Drink calories.</b> A banana-peanut-butter-milk shake (~500 kcal) is the easiest booster.<br>
      <b>🥚 Hit protein.</b> Eggs, chicken, fish, dhal and sprats help the extra weight become muscle — aim for ${t.protein} g/day.<br>

      <b>🏋️ Train 3×/week.</b> Strength training turns a surplus into muscle rather than fat.</div>` : ""}`;
}

    <input type="file" id="impFile" accept="application/json" class="hidden">`;
}
function bindProfile() {
  const p = S.profile;
  $$("[data-pgoal]").forEach((b) => (b.onclick = () => { p.goal = b.dataset.pgoal; save(); render(); toast(`Goal: ${GOALS[p.goal].name}`); }));
  $("#pSave").onclick = () => {
    p.age = +$("#pAge").value || p.age; p.height = +$("#pH").value || p.height; p.target = +$("#pT").value || p.target;
    p.name = $("#pName").value.trim(); p.sex = $("#pSex").value; p.activity = +$("#pAct").value;
    const ck = +$("#pCk").value; p.custom = ck ? { kcal: ck } : null;
    if (ck) { const base = calcTargets(p); const ratio = ck / base.kcal; p.custom = { kcal: ck, carbs: Math.max(0, Math.round((ck - base.protein * 4 - base.fat * ratio * 9) / 4)), fat: Math.round(base.fat * ratio) }; }
    save(); render(); toast("Saved ✓");
  };
  $("#pKey").onclick = () => openKeySetup(false);
  $$("#pTheme button").forEach((b) => (b.onclick = () => { S.settings.theme = b.dataset.v; save(); applyTheme(); render(); }));
  $("#pW").onchange = (e) => { S.settings.water = Math.max(1, Math.min(20, +e.target.value || 8)); save(); };
  $("#pExp").onclick = () => {
    const { apiKey, ...data } = S;
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `caltrack-${dkey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#pImp").onclick = () => $("#impFile").click();
  $("#impFile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.profile) throw 0; S = { ...S, ...d, apiKey: S.apiKey }; save(); render(); toast("Data imported ✓"); } catch { toast("That file isn't a CalTrack backup"); }
  };
  $("#pReset").onclick = () => { if (confirm("Delete all your data from this phone? This can't be undone.")) { try { localStorage.removeItem(KEY); } catch {} location.reload(); } };
}

/* ============================== ROUTER ============================== */
function render() {
  applyTheme();
  if (!S.profile) return renderOnboarding();
  $("#nav").classList.remove("hidden");
  $$("#nav [data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const views = { today: [renderToday, bindToday], foods: [renderFoods, bindFoods], progress: [renderProgress, bindProgress], profile: [renderProfile, bindProfile] };
  const [r, b] = views[tab];
  $("#app").innerHTML = `<div class="fade-in">${r()}</div>`;
  b();
}
$$("#nav [data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; if (tab === "today") viewDate = viewDate || dkey(); render(); window.scrollTo({ top: 0 }); }));
$("#fab").onclick = () => openAdd();
document.addEventListener("visibilitychange", () => { if (!document.hidden && tab === "today" && S.profile) render(); });
render();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
}
</script>
</body>
</html>
